<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- Background -->
  <rect width="1280" height="720" fill="#FFFFFF"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="1280" height="70" fill="#003366"/>
  <rect x="0" y="0" width="6" height="70" fill="#CC0000"/>
  <text x="40" y="46" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="28" font-weight="bold">
    01 | المشكلة والحل المقترح
  </text>
  <text x="1220" y="46" text-anchor="end" fill="#FFFFFF" font-family="Georgia, Microsoft YaHei, serif" font-size="18" font-weight="bold">MATAX</text>
  
  <!-- Key message bar -->
  <rect x="0" y="70" width="1280" height="50" fill="#F0F4F8"/>
  <rect x="0" y="70" width="6" height="50" fill="#0066CC"/>
  <text x="40" y="102" fill="#1E293B" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18">
    MATAX يحل 4 مشاكل حرجة من خلال 5 ركائز رقمية متكاملة
  </text>
  
  <!-- LEFT SIDE: Problems -->
  <rect x="40" y="140" width="580" height="510" fill="#FEF2F2" rx="12" stroke="#FECACA" stroke-width="1"/>
  <rect x="40" y="140" width="580" height="55" fill="#DC2626" rx="12"/>
  <rect x="40" y="185" width="580" height="10" fill="#DC2626"/>
  <text x="330" y="178" text-anchor="middle" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="bold">المشكلة</text>
  
  <!-- Problem 1 -->
  <rect x="60" y="210" width="540" height="85" fill="#FFFFFF" rx="8" stroke="#FEE2E2" stroke-width="1"/>
  <rect x="60" y="210" width="6" height="85" fill="#DC2626" rx="3"/>
  <text x="110" y="240" fill="#DC2626" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="bold">01 تعقيد التشريعات الجبائية</text>
  <text x="110" y="265" fill="#64748B" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13">صعوبة استيعاب القوانين المالية السنوية</text>
  <text x="110" y="285" fill="#64748B" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12">وتداخل الإجراءات الإدارية</text>
  
  <!-- Problem 2 -->
  <rect x="60" y="305" width="540" height="85" fill="#FFFFFF" rx="8" stroke="#FEE2E2" stroke-width="1"/>
  <rect x="60" y="305" width="6" height="85" fill="#DC2626" rx="3"/>
  <text x="110" y="335" fill="#DC2626" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="bold">02 مخاطر الأخطاء البشرية</text>
  <text x="110" y="360" fill="#64748B" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13">الاعتماد على التعبئة اليدوية للتصاريح</text>
  <text x="110" y="380" fill="#64748B" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12">الدورية وتأخير المواعيد</text>
  
