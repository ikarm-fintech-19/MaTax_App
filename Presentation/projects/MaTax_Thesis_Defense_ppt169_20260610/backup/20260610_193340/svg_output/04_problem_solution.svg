  <text x="730" y="282" fill="#64748B" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12">مسبقة — تقليل زمن التأهيل لـ 48 ساعة</text>
  
  <!-- Solution 2 -->
  <rect x="680" y="300" width="540" height="80" fill="#FFFFFF" rx="8" stroke="#DCFCE7" stroke-width="1"/>
