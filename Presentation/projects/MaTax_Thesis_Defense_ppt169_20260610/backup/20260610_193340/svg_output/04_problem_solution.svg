  <text x="730" y="355" fill="#64748B" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13">رسائل SMS والبريد الإلكتروني</text>
  <text x="730" y="372" fill="#64748B" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12">قبل المواعيد الجبائية</text>
  
  <!-- Solution 3 -->
  <rect x="680" y="390" width="540" height="80" fill="#FFFFFF" rx="8" stroke="#DCFCE7" stroke-width="1"/>
  <rect x="680" y="390" width="6" height="80" fill="#16A34A" rx="3"/>
  <text x="730" y="420" fill="#16A34A" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="bold">📋 الأتمتة الكاملة والتصريح الآلي</text>
  <text x="730" y="445" fill="#64748B" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13">توليد تصاريح G50 بنسبة خطأ 0%</text>
  <text x="730" y="462" fill="#64748B" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12">وصفر أخطاء يدوية</text>
  
  <!-- Solution 4 -->
  <rect x="680" y="480" width="540" height="80" fill="#FFFFFF" rx="8" stroke="#DCFCE7" stroke-width="1"/>
  <rect x="680" y="480" width="6" height="80" fill="#16A34A" rx="3"/>
  <text x="730" y="510" fill="#16A34A" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="bold">☁️ أرشفة سحابية مشفرة</text>
  <text x="730" y="535" fill="#64748B" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13">تخزين آمن للمستندات الجبائية</text>
  <text x="730" y="552" fill="#64748B" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12">بتشفير 256-SSL</text>
  
  <!-- Solution 5 -->
  <rect x="680" y="570" width="540" height="65" fill="#FFFFFF" rx="8" stroke="#DCFCE7" stroke-width="1"/>
  <rect x="680" y="570" width="6" height="65" fill="#0891B2" rx="3"/>
  <text x="730" y="600" fill="#0891B2" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="bold">💰 اشتراكات اقتصادية مقارنة</text>
  <text x="730" y="622" fill="#64748B" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12">تقليل التكاليف بنسبة 60% مقارنة بالمكاتب التقليدية</text>
  
  <!-- Footer -->
  <line x1="40" y1="670" x2="1240" y2="670" stroke="#E2E8F0" stroke-width="1"/>
  <text x="40" y="700" fill="#94A3B8" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12">المصدر: دراسة المشروع</text>
  <text x="640" y="700" text-anchor="middle" fill="#94A3B8" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12">المشكلة والحل المقترح</text>
  <text x="1220" y="700" text-anchor="end" fill="#64748B" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14">04</text>
