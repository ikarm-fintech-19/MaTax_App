  <text x="110" y="455" fill="#64748B" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13">غياب نظام متابعة وتنبيه ذكي</text>
  <text x="110" y="475" fill="#64748B" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12">للمواعيد القانونية</text>
  
