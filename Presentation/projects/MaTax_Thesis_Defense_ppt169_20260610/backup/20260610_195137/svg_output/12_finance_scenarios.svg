  <text x="430" y="388" text-anchor="middle" fill="#16A34A" font-family="Montserrat, Arial, sans-serif" font-size="14" font-weight="bold">+1,878,700</text>
  <text x="640" y="388" text-anchor="middle" fill="#00527F" font-family="Montserrat, Arial, sans-serif" font-size="14" font-weight="bold">+1,565,600</text>
  <text x="850" y="388" text-anchor="middle" fill="#D62828" font-family="Montserrat, Arial, sans-serif" font-size="14" font-weight="bold">+1,239,600</text>
  <text x="1060" y="388" text-anchor="middle" fill="#16A34A" font-family="Montserrat, Arial, sans-serif" font-size="13">تدفق نقدي إيجابي دائماً</text>
  
  <!-- Row 5 -->
  <rect x="80" y="410" width="1120" height="42" fill="#FFFFFF" rx="4"/>
  <text x="200" y="438" text-anchor="middle" fill="#44546A" font-family="Lato Light, Arial, sans-serif" font-size="14">Marge Nette</text>
  <text x="430" y="438" text-anchor="middle" fill="#16A34A" font-family="Montserrat, Arial, sans-serif" font-size="14" font-weight="bold">46.9%</text>
  <text x="640" y="438" text-anchor="middle" fill="#00527F" font-family="Montserrat, Arial, sans-serif" font-size="14" font-weight="bold">46.7%</text>
  <text x="850" y="438" text-anchor="middle" fill="#D62828" font-family="Montserrat, Arial, sans-serif" font-size="14" font-weight="bold">46.1%</text>
  <text x="1060" y="438" text-anchor="middle" fill="#44546A" font-family="Lato Light, Arial, sans-serif" font-size="13">مستقر ≥ 46%</text>
  
  <!-- Row 6 -->
  <rect x="80" y="460" width="1120" height="42" fill="#F8FAFC" rx="4"/>
  <text x="200" y="488" text-anchor="middle" fill="#44546A" font-family="Lato Light, Arial, sans-serif" font-size="14">Délai récupération</text>
  <text x="430" y="488" text-anchor="middle" fill="#16A34A" font-family="Montserrat, Arial, sans-serif" font-size="14" font-weight="bold">1 ans 7 mois</text>
  <text x="640" y="488" text-anchor="middle" fill="#00527F" font-family="Montserrat, Arial, sans-serif" font-size="14" font-weight="bold">1 ans 9 mois</text>
  <text x="850" y="488" text-anchor="middle" fill="#D62828" font-family="Montserrat, Arial, sans-serif" font-size="14" font-weight="bold">1 ans 11 mois</text>
  <text x="1060" y="488" text-anchor="middle" fill="#16A34A" font-family="Montserrat, Arial, sans-serif" font-size="13">&lt; 2 سنوات دائماً</text>
  
  <!-- Risk cards -->
  <rect x="60" y="510" width="570" height="170" fill="#FFF5F5" rx="10" stroke="#FECACA" stroke-width="1"/>
  <rect x="60" y="510" width="6" height="170" fill="#D62828" rx="3"/>
  <text x="100" y="540" fill="#D62828" font-family="Montserrat, Arial, sans-serif" font-size="15" font-weight="bold">المخاطر الرئيسية</text>
  <text x="100" y="570" fill="#44546A" font-family="Lato Light, Arial, sans-serif" font-size="13">• التأخر عن السوق (slow adoption)</text>
  <text x="100" y="595" fill="#44546A" font-family="Lato Light, Arial, sans-serif" font-size="13">• تغييرات تشريعية مفاجئة</text>
  <text x="100" y="620" fill="#44546A" font-family="Lato Light, Arial, sans-serif" font-size="13">• منافسة من مكاتب محاسبة تقليدية</text>
  <text x="100" y="645" fill="#44546A" font-family="Lato Light, Arial, sans-serif" font-size="13">• بنية تحتية تقنية في الجزائر</text>
  
  <rect x="650" y="510" width="570" height="170" fill="#F0FDF4" rx="10" stroke="#BBF7D0" stroke-width="1"/>
  <rect x="650" y="510" width="6" height="170" fill="#16A34A" rx="3"/>
  <text x="690" y="540" fill="#16A34A" font-family="Montserrat, Arial, sans-serif" font-size="15" font-weight="bold">نقاط القوة</text>
  <text x="690" y="570" fill="#44546A" font-family="Lato Light, Arial, sans-serif" font-size="13">• إيجابي في كل السيناريوهات</text>
  <text x="690" y="595" fill="#44546A" font-family="Lato Light, Arial, sans-serif" font-size="13">• هامش ربح عالي ومستقر</text>
  <text x="690" y="620" fill="#44546A" font-family="Lato Light, Arial, sans-serif" font-size="13">• نموذج SaaS قابل للتوسع</text>
  <text x="690" y="645" fill="#44546A" font-family="Lato Light, Arial, sans-serif" font-size="13">• CLV/CAC = 10.6x ممتاز</text>
  
