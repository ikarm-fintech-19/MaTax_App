  <text x="40" y="718" fill="#94A3B8" font-family="Lato Light, Arial, sans-serif" font-size="12">المصدر: PRODUCT.md — تحليل السيناريوهات</text>
  <text x="640" y="718" text-anchor="middle" fill="#94A3B8" font-family="Lato Light, Arial, sans-serif" font-size="12">تحليل السيناريوهات والمخاطر</text>
  <text x="1220" y="718" text-anchor="end" fill="#44546A" font-family="Montserrat, Arial, sans-serif" font-size="14">12</text>
