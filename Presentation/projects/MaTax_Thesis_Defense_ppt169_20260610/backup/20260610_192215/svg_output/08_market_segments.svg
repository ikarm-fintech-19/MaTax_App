<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- Background -->
  <rect width="1280" height="720" fill="#FFFFFF"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="1280" height="70" fill="#003366"/>
  <rect x="0" y="0" width="6" height="70" fill="#CC0000"/>
  <text x="40" y="46" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="28" font-weight="bold">
    03 | السوق والنموذج التجاري
  </text>
  <text x="1220" y="46" text-anchor="end" fill="#FFFFFF" font-family="Georgia, Microsoft YaHei, serif" font-size="18" font-weight="bold">MATAX</text>
  
  <!-- Key message bar -->
  <rect x="0" y="70" width="1280" height="50" fill="#F0F4F8"/>
  <rect x="0" y="70" width="6" height="50" fill="#0066CC"/>
  <text x="40" y="102" fill="#1D1D1F" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18">
    MATAX يستهدف شرائح متنوعة من المقاولين والشركات الجزائرية
  </text>
  
  <!-- LEFT: Market Segments -->
  <rect x="40" y="140" width="600" height="510" fill="#F0F4F8" rx="8"/>
  <rect x="40" y="140" width="600" height="50" fill="#003366" rx="8"/>
  <rect x="40" y="180" width="600" height="10" fill="#003366"/>
  <text x="340" y="174" text-anchor="middle" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold">الشرائح المستهدفة</text>
  
  <!-- Segment 1 -->
  <rect x="60" y="210" width="560" height="120" fill="#FFFFFF" rx="6"/>
  <rect x="60" y="210" width="6" height="120" fill="#C62828" rx="3"/>
  <use data-icon="tabler-outline/user" x="85" y="240" width="40" height="40" fill="#C62828"/>
  <text x="140" y="235" fill="#C62828" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="bold">المقاولون والشركات الناشئة</text>
  <text x="140" y="258" fill="#5A5A5A" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13">890,000 مقاول + 46,000 مؤسسة صغيرة ومتوسطة</text>
  <text x="140" y="278" fill="#8A8A8A" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12">شريحة النمو الأسرع مع أولوية للرقمنة</text>
  
  <!-- Segment 2 -->
  <rect x="60" y="345" width="560" height="120" fill="#FFFFFF" rx="6"/>
  <rect x="60" y="345" width="6" height="120" fill="#0066CC" rx="3"/>
  <use data-icon="tabler-outline/buildings" x="85" y="375" width="40" height="40" fill="#0066CC"/>
  <text x="140" y="370" fill="#0066CC" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="bold">مكاتب المحاسبة</text>
  <text x="140" y="393" fill="#5A5A5A" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13">2,613 مكتب + 12,560 محاسب معتمد</text>
  <text x="140" y="413" fill="#8A8A8A" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12">شريحة الاحتراف: بحاجة لأدوات رقمية متقدمة</text>
  
  <!-- Segment 3 -->
  <rect x="60" y="480" width="560" height="120" fill="#FFFFFF" rx="6"/>
  <rect x="60" y="480" width="6" height="120" fill="#2E7D32" rx="3"/>
  <use data-icon="tabler-outline/building-factory" x="85" y="510" width="40" height="40" fill="#2E7D32"/>
  <text x="140" y="505" fill="#2E7D32" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="bold">المؤسسات المتوسطة والكبيرة</text>
  <text x="140" y="528" fill="#5A5A5A" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13">58,000 مؤسسة + 1,200 مؤسسة خارج النظام الجبائي</text>
  <text x="140" y="548" fill="#8A8A8A" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12">حلول مخصصة للمؤسسات متعددة الفروع</text>
  
  <!-- RIGHT: Revenue Streams -->
  <rect x="660" y="140" width="580" height="510" fill="#F0F4F8" rx="8"/>
  <rect x="660" y="140" width="580" height="50" fill="#0066CC" rx="8"/>
  <rect x="660" y="180" width="580" height="10" fill="#0066CC"/>
  <text x="950" y="174" text-anchor="middle" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold">مصادر الإيرادات</text>
  
  <!-- Revenue 1: Subscriptions -->
  <rect x="680" y="210" width="540" height="140" fill="#FFFFFF" rx="6"/>
  <rect x="680" y="210" width="6" height="140" fill="#003366" rx="3"/>
  <text x="730" y="245" fill="#003366" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold">الاشتراكات الشهرية/السنوية</text>
  <text x="730" y="272" fill="#5A5A5A" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13">Start: 1,490 دج | Pro: 3,490 دج | Enterprise: 5,990 دج</text>
  <text x="730" y="298" fill="#2E7D32" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="bold">مصدر الإيراد الأساسي + 70%</text>
  <text x="730" y="320" fill="#8A8A8A" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12">تقليل الاعتماد على المكاتب التقليدية</text>
  
  <!-- Revenue 2: Extra Services -->
  <rect x="680" y="365" width="540" height="120" fill="#FFFFFF" rx="6"/>
  <rect x="680" y="365" width="6" height="120" fill="#0099AA" rx="3"/>
  <text x="730" y="395" fill="#0099AA" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold">الخدمات الإضافية</text>
  <text x="730" y="420" fill="#5A5A5A" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13">دعم تقني مخصص + استشارات ضريبية + تدريب</text>
  <text x="730" y="448" fill="#8A8A8A" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12">هوامش ربح عالية + تعميق العلاقة مع العميل</text>
  
  <!-- Revenue 3: Partnerships -->
  <rect x="680" y="500" width="540" height="120" fill="#FFFFFF" rx="6"/>
  <rect x="680" y="500" width="6" height="120" fill="#1565C0" rx="3"/>
  <text x="730" y="530" fill="#1565C0" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold">الشراكات والتعاون</text>
  <text x="730" y="555" fill="#5A5A5A" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13">عمولات بيع مشترك مع البنوك + تكامل مع أنظمة ERP</text>
  <text x="730" y="583" fill="#8A8A8A" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12">توسيع قاعدة المستخدمين عبر شراكات استراتيجية</text>
  
  <!-- Footer -->
  <line x1="40" y1="665" x2="1240" y2="665" stroke="#F0F4F8" stroke-width="1"/>
  <text x="40" y="695" fill="#8A8A8A" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12">المصدر: دراسةالمشروع + PRODUCT.md</text>
  <text x="640" y="695" text-anchor="middle" fill="#8A8A8A" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12">السوق والنموذج التجاري</text>
  <text x="1220" y="695" text-anchor="end" fill="#666666" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14">08</text>
</svg>
