<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- Background -->
  <rect width="1280" height="720" fill="#FFFFFF"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="1280" height="70" fill="#003366"/>
  <rect x="0" y="0" width="6" height="70" fill="#CC0000"/>
  <text x="40" y="46" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="28" font-weight="bold">
    06 | فريق العمل
  </text>
  <text x="1220" y="46" text-anchor="end" fill="#FFFFFF" font-family="Georgia, Microsoft YaHei, serif" font-size="18" font-weight="bold">MATAX</text>
  
  <!-- Key message bar -->
  <rect x="0" y="70" width="1280" height="50" fill="#F0F4F8"/>
  <rect x="0" y="70" width="6" height="50" fill="#0066CC"/>
  <text x="40" y="102" fill="#1E293B" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18">
    فريق مؤسس متكامل بخبرات متنوعة في المحاسبة والتقنية والإشراف
  </text>
  
  <!-- Team Roster -->
  <!-- Team Member 1: Owner - Hamoum Ikram -->
  <rect x="60" y="140" width="350" height="200" fill="#F8FAFC" rx="12" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="60" y="140" width="350" height="8" fill="#003366" rx="4"/>
  <circle cx="235" cy="215" r="45" fill="#003366" fill-opacity="0.1"/>
  <text x="235" y="228" text-anchor="middle" fill="#003366" font-family="Georgia, Microsoft YaHei, serif" font-size="36" font-weight="bold">HI</text>
  <text x="235" y="285" text-anchor="middle" fill="#1E293B" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold">حموم إكرام</text>
  <text x="235" y="312" text-anchor="middle" fill="#003366" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="bold">صاحبة المشروع</text>
  <text x="235" y="335" text-anchor="middle" fill="#64748B" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13">محاسبة + تكنولوجيا المعلومات</text>
  
  <!-- Team Member 2: Supervisor - Belabbes Mokhtar -->
  <rect x="440" y="140" width="350" height="200" fill="#F8FAFC" rx="12" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="440" y="140" width="350" height="8" fill="#0066CC" rx="4"/>
  <circle cx="615" cy="215" r="45" fill="#0066CC" fill-opacity="0.1"/>
  <text x="615" y="228" text-anchor="middle" fill="#0066CC" font-family="Georgia, Microsoft YaHei, serif" font-size="36" font-weight="bold">BM</text>
  <text x="615" y="285" text-anchor="middle" fill="#1E293B" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold">بلعباس مختار</text>
  <text x="615" y="312" text-anchor="middle" fill="#0066CC" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="bold">المشرف على المشروع</text>
  <text x="615" y="335" text-anchor="middle" fill="#64748B" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13">أستاذ محاسبة</text>
  
  <!-- Team Member 3: Co-Supervisor - Mokhtafa Fatima -->
  <rect x="820" y="140" width="350" height="200" fill="#F8FAFC" rx="12" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="820" y="140" width="350" height="8" fill="#0099AA" rx="4"/>
  <circle cx="995" cy="215" r="45" fill="#0099AA" fill-opacity="0.1"/>
  <text x="995" y="228" text-anchor="middle" fill="#0099AA" font-family="Georgia, Microsoft YaHei, serif" font-size="36" font-weight="bold">MF</text>
  <text x="995" y="285" text-anchor="middle" fill="#1E293B" font-family="Microsoft YaHei, Arial, sans-serif" font-size="20" font-weight="bold">مفتاح فاطمة</text>
  <text x="995" y="312" text-anchor="middle" fill="#0099AA" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="bold">المشرفة على المشروع</text>
  <text x="995" y="335" text-anchor="middle" fill="#64748B" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13">أستاذة محاسبة</text>
  
  <!-- Roadmap Timeline -->
  <rect x="60" y="370" width="1160" height="290" fill="#F8FAFC" rx="12" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="60" y="370" width="1160" height="50" fill="#003366" rx="12"/>
  <rect x="60" y="410" width="1160" height="10" fill="#003366"/>
  <text x="640" y="404" text-anchor="middle" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold">الخريطة الزمنية</text>
  
  <!-- Phase 1 -->
  <rect x="80" y="435" width="240" height="95" fill="#FFFFFF" rx="8" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="80" y="435" width="240" height="6" fill="#16A34A" rx="3"/>
  <text x="200" y="467" text-anchor="middle" fill="#16A34A" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="bold">المرحلة 1</text>
  <text x="200" y="489" text-anchor="middle" fill="#1E293B" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="bold">MVP &amp; الإطلاق</text>
  <text x="200" y="511" text-anchor="middle" fill="#64748B" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12">0-6 أشهر</text>
  <text x="200" y="523" text-anchor="middle" fill="#16A34A" font-family="Microsoft YaHei, Arial, sans-serif" font-size="11" font-weight="bold">+400 عميل</text>
  
  <!-- Phase 2 -->
  <rect x="340" y="435" width="240" height="95" fill="#FFFFFF" rx="8" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="340" y="435" width="240" height="6" fill="#0066CC" rx="3"/>
  <text x="460" y="467" text-anchor="middle" fill="#0066CC" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="bold">المرحلة 2</text>
  <text x="460" y="489" text-anchor="middle" fill="#1E293B" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="bold">التوسع والنمو</text>
  <text x="460" y="511" text-anchor="middle" fill="#64748B" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12">6-18 شهر</text>
  <text x="460" y="523" text-anchor="middle" fill="#0066CC" font-family="Microsoft YaHei, Arial, sans-serif" font-size="11" font-weight="bold">+960 عميل</text>
  
  <!-- Phase 3 -->
  <rect x="600" y="435" width="240" height="95" fill="#FFFFFF" rx="8" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="600" y="435" width="240" height="6" fill="#0891B2" rx="3"/>
  <text x="720" y="467" text-anchor="middle" fill="#0891B2" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="bold">المرحلة 3</text>
  <text x="720" y="489" text-anchor="middle" fill="#1E293B" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="bold">الابتكار والتمكين</text>
  <text x="720" y="511" text-anchor="middle" fill="#64748B" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12">18-36 شهر</text>
  <text x="720" y="523" text-anchor="middle" fill="#0891B2" font-family="Microsoft YaHei, Arial, sans-serif" font-size="11" font-weight="bold">+2,500 عميل</text>
  
  <!-- Phase 4 -->
  <rect x="860" y="435" width="340" height="95" fill="#FFFFFF" rx="8" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="860" y="435" width="340" height="6" fill="#7C3AED" rx="3"/>
  <text x="1030" y="467" text-anchor="middle" fill="#7C3AED" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="bold">المرحلة 4</text>
  <text x="1030" y="489" text-anchor="middle" fill="#1E293B" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13" font-weight="bold">الريادة والتوطين</text>
  <text x="1030" y="511" text-anchor="middle" fill="#64748B" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12">36+ شهر</text>
  <text x="1030" y="523" text-anchor="middle" fill="#7C3AED" font-family="Microsoft YaHei, Arial, sans-serif" font-size="11" font-weight="bold">ريادة السوق الجزائري</text>
  
  <!-- Bottom milestones -->
  <rect x="80" y="550" width="1100" height="85" fill="#FFFFFF" rx="8" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="80" y="550" width="6" height="85" fill="#CC0000" rx="3"/>
  <text x="120" y="577" fill="#CC0000" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="bold">المراحل الرئيسية:</text>
  <text x="120" y="600" fill="#475569" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13">BEP الشهر 4 | 400 عميل السنة 1 | 960 عميل الشهر 12 | 2,500 عميل الشهر 36</text>
  <text x="120" y="623" fill="#475569" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13">توسيع Zakat &amp; Douane في 2026 | AI/ML للاستشراف الضريبي في 2027</text>
  
  <!-- Footer -->
  <line x1="40" y1="660" x2="1240" y2="660" stroke="#E2E8F0" stroke-width="1"/>
  <text x="40" y="690" fill="#94A3B8" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12">المصدر: خطة العمل</text>
  <text x="640" y="690" text-anchor="middle" fill="#94A3B8" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12">فريق العمل والخريطة الزمنية</text>
  <text x="1220" y="690" text-anchor="end" fill="#64748B" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14">16</text>
</svg>
