  <text x="690" y="645" fill="#44546A" font-family="Lato Light, Arial, sans-serif" font-size="13">• توسع مضمون في 3 شرائح مستهدفة</text>
  
  <line x1="40" y1="690" x2="1240" y2="690" stroke="#E2E8F0" stroke-width="1"/>
