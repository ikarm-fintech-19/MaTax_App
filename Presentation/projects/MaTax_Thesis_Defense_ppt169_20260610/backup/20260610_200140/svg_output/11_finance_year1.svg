  <text x="100" y="645" fill="#44546A" font-family="Lato Light, Arial, sans-serif" font-size="13">• تدفق نقدي إيجابي من السنة الأولى</text>
  
  <rect x="650" y="535" width="570" height="140" fill="#F8FAFC" rx="10" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="650" y="535" width="6" height="140" fill="#16A34A" rx="3"/>
  <text x="690" y="565" fill="#16A34A" font-family="Montserrat, Arial, sans-serif" font-size="15" font-weight="bold">نقاط القوة</text>
