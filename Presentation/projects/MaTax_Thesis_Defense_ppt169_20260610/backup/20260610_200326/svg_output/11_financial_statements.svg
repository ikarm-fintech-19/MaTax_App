<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- Background -->
  <rect width="1280" height="720" fill="#FFFFFF"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="1280" height="70" fill="#003366"/>
  <rect x="0" y="0" width="6" height="70" fill="#CC0000"/>
  <text x="40" y="46" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="28" font-weight="bold">
    04 | الدراسة المالية - القوائم المالية
  </text>
  <text x="1220" y="46" text-anchor="end" fill="#FFFFFF" font-family="Georgia, Microsoft YaHei, serif" font-size="18" font-weight="bold">MATAX</text>
  
  <!-- Key message bar -->
  <rect x="0" y="70" width="1280" height="50" fill="#F0F4F8"/>
  <rect x="0" y="70" width="6" height="50" fill="#0066CC"/>
  <text x="40" y="102" fill="#1E293B" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18">
    التمويل المطلوب: 3,880,000 دج - BEP في الشهر 4 - VAN: +79.6M دج
  </text>
  
  <!-- CONSULTING TABLE: 9 rows x 3 columns -->
  <!-- Table Header -->
  <rect x="60" y="140" width="1160" height="50" fill="#003366" rx="6"/>
  <text x="280" y="172" text-anchor="middle" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="bold">البيان</text>
  <text x="680" y="172" text-anchor="middle" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="bold">السنة الأولى</text>
  <text x="1040" y="172" text-anchor="middle" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="bold">الملاحظات</text>
  
  <!-- Row 1 -->
  <rect x="60" y="195" width="1160" height="55" fill="#F8FAFC" rx="4"/>
  <text x="280" y="228" text-anchor="middle" fill="#1E293B" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="bold">الإيرادات التشغيلية</text>
  <text x="680" y="228" text-anchor="middle" fill="#16A34A" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="bold">9,600,000 دج</text>
  <text x="1040" y="228" text-anchor="middle" fill="#64748B" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13">960 عميل × 10,000 دج/شهر</text>
  
  <!-- Row 2 -->
  <rect x="60" y="255" width="1160" height="55" fill="#FFFFFF" rx="4"/>
  <text x="280" y="288" text-anchor="middle" fill="#1E293B" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="bold">التكلفة الإجمالية</text>
  <text x="680" y="288" text-anchor="middle" fill="#DC2626" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="bold">5,265,000 دج</text>
  <text x="1040" y="288" text-anchor="middle" fill="#64748B" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13">تشغيل + تسويق + تطوير</text>
  
  <!-- Row 3 -->
  <rect x="60" y="315" width="1160" height="55" fill="#F0FDF4" rx="4"/>
  <text x="280" y="348" text-anchor="middle" fill="#1E293B" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="bold">صافي الربح قبل الضرائب</text>
  <text x="680" y="348" text-anchor="middle" fill="#16A34A" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="bold">4,335,000 دج</text>
  <text x="1040" y="348" text-anchor="middle" fill="#16A34A" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="bold">هامش صافي +45.2%</text>
  
  <!-- Row 4 -->
  <rect x="60" y="375" width="1160" height="55" fill="#FFFFFF" rx="4"/>
  <text x="280" y="408" text-anchor="middle" fill="#1E293B" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="bold">التدفقات النقدية التراكمية</text>
  <text x="680" y="408" text-anchor="middle" fill="#16A34A" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="bold">+79,600,000 دج</text>
  <text x="1040" y="408" text-anchor="middle" fill="#64748B" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13">VAN على 3 سنوات</text>
  
  <!-- Row 5 -->
  <rect x="60" y="435" width="1160" height="55" fill="#F8FAFC" rx="4"/>
  <text x="280" y="468" text-anchor="middle" fill="#1E293B" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="bold">معدل الخصم الداخلي (DR)</text>
  <text x="680" y="468" text-anchor="middle" fill="#16A34A" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="bold">سنة + 9 أشهر</text>
  <text x="1040" y="468" text-anchor="middle" fill="#64748B" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13">استرداد سريع جداً</text>
  
  <!-- Row 6 -->
  <rect x="60" y="495" width="1160" height="55" fill="#FFFFFF" rx="4"/>
  <text x="280" y="528" text-anchor="middle" fill="#1E293B" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="bold">نقطة التعادل (BEP)</text>
  <text x="680" y="528" text-anchor="middle" fill="#16A34A" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="bold">الشهر 4 | 61 عميل</text>
  <text x="1040" y="528" text-anchor="middle" fill="#64748B" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13">BEP مبكر جداً</text>
  
  <!-- Row 7 -->
  <rect x="60" y="555" width="1160" height="55" fill="#F8FAFC" rx="4"/>
  <text x="280" y="588" text-anchor="middle" fill="#1E293B" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="bold">هامش الربح التشغيلي (OM)</text>
  <text x="680" y="588" text-anchor="middle" fill="#16A34A" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="bold">+46.6%</text>
  <text x="1040" y="588" text-anchor="middle" fill="#64748B" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13">هامش صافي مرتفع جداً</text>
  
  <!-- Row 8 -->
  <rect x="60" y="615" width="1160" height="50" fill="#FFFFFF" rx="4"/>
  <text x="280" y="647" text-anchor="middle" fill="#1E293B" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="bold">العائد على الاستثمار (ROI)</text>
  <text x="680" y="647" text-anchor="middle" fill="#16A34A" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="bold">247%</text>
  <text x="1040" y="647" text-anchor="middle" fill="#64748B" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13">العائد على 3 سنوات</text>
  
  <!-- Footer -->
  <line x1="40" y1="680" x2="1240" y2="680" stroke="#E2E8F0" stroke-width="1"/>
  <text x="40" y="710" fill="#94A3B8" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12">المصدر: دراسة المشروع</text>
  <text x="640" y="710" text-anchor="middle" fill="#94A3B8" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12">القوائم المالية</text>
  <text x="1220" y="710" text-anchor="end" fill="#64748B" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14">11</text>
</svg>
