  <text x="450" y="310" text-anchor="middle" fill="#16A34A" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="bold">[+] استباقي</text>
  <text x="650" y="310" text-anchor="middle" fill="#DC2626" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15">[-] سلبي فقط</text>
  <text x="850" y="310" text-anchor="middle" fill="#DC2626" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15">[-] غير متوفر</text>
  <text x="1050" y="310" text-anchor="middle" fill="#EA580C" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15">[!]️ محدود</text>
  
