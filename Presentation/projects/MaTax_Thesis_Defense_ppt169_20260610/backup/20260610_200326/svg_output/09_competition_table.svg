  <text x="450" y="380" text-anchor="middle" fill="#16A34A" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="bold">[+] 256-SSL</text>
  <text x="650" y="380" text-anchor="middle" fill="#16A34A" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15">[+] Cloud</text>
  <text x="850" y="380" text-anchor="middle" fill="#DC2626" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15">[-] محلي فقط</text>
  <text x="1050" y="380" text-anchor="middle" fill="#DC2626" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15">[-] غير متوفر</text>
  
  <!-- Row 4: الامتثال القانوني -->
