  <text x="220" y="450" text-anchor="middle" fill="#1E293B" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="bold">الامتثال للتشريعات الجزائرية</text>
  <text x="450" y="450" text-anchor="middle" fill="#16A34A" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="bold">[+] تحديث فوري</text>
  <text x="650" y="450" text-anchor="middle" fill="#DC2626" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15">[-] بطيء</text>
  <text x="850" y="450" text-anchor="middle" fill="#16A34A" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15">[+] متوسط</text>
  <text x="1050" y="450" text-anchor="middle" fill="#DC2626" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15">[-] محدود</text>
  
  <!-- Row 5: التكلفة الشهرية -->
  <rect x="60" y="480" width="1160" height="65" fill="#F8FAFC" rx="4"/>
  <text x="220" y="520" text-anchor="middle" fill="#1E293B" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="bold">التكلفة الشهرية</text>
  <text x="450" y="520" text-anchor="middle" fill="#16A34A" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="bold">1,490 دج</text>
  <text x="650" y="520" text-anchor="middle" fill="#DC2626" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="bold">5,000+ دج</text>
  <text x="850" y="520" text-anchor="middle" fill="#DC2626" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="bold">15,000+ دج</text>
  <text x="1050" y="520" text-anchor="middle" fill="#EA580C" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="bold">3,500+ دج</text>
  
  <!-- Row 6: التكلفة السنوية -->
  <rect x="60" y="550" width="1160" height="65" fill="#FFFFFF" rx="4"/>
  <text x="220" y="590" text-anchor="middle" fill="#1E293B" font-family="Microsoft YaHei, Arial, sans-serif" font-size="15" font-weight="bold">التكلفة السنوية</text>
  <text x="450" y="590" text-anchor="middle" fill="#16A34A" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="bold">16,880 دج</text>
  <text x="650" y="590" text-anchor="middle" fill="#DC2626" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="bold">60,000+ دج</text>
  <text x="850" y="590" text-anchor="middle" fill="#DC2626" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="bold">180,000+ دج</text>
  <text x="1050" y="590" text-anchor="middle" fill="#EA580C" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16" font-weight="bold">42,000+ دج</text>
  
  <!-- Footer -->
  <line x1="40" y1="640" x2="1240" y2="640" stroke="#E2E8F0" stroke-width="1"/>
  <text x="40" y="670" fill="#94A3B8" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12">المصدر: مقارنة السوق</text>
  <text x="640" y="670" text-anchor="middle" fill="#94A3B8" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12">التميّز التنافسي</text>
  <text x="1220" y="670" text-anchor="end" fill="#64748B" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14">09</text>
