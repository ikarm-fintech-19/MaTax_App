  </text>
  
  <!-- Decorative divider -->
  <line x1="380" y1="415" x2="900" y2="415" stroke="#0066CC" stroke-width="2"/>
  <circle cx="640" cy="415" r="6" fill="#0066CC"/>
  <circle cx="380" cy="415" r="3" fill="#0066CC" fill-opacity="0.5"/>
  <circle cx="900" cy="415" r="3" fill="#0066CC" fill-opacity="0.5"/>
  
  <!-- Presenter info card -->
  <rect x="240" y="450" width="800" height="160" fill="#F8FAFC" rx="12" stroke="#E2E8F0" stroke-width="1"/>
  <text x="640" y="495" text-anchor="middle" fill="#1E293B" font-family="Microsoft YaHei, Arial, sans-serif" font-size="24" font-weight="bold">
