<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- Background -->
  <rect width="1280" height="720" fill="#FFFFFF"/>
  
  <!-- Top decorative area -->
  <rect x="0" y="0" width="1280" height="120" fill="#003366"/>
  <rect x="0" y="0" width="8" height="120" fill="#CC0000"/>
  
  <!-- Geometric pattern top right -->
  <path d="M1280 0 L1100 0 L1280 120 Z" fill="#004080" fill-opacity="0.3"/>
  
  <!-- Logo area -->
  <rect x="1060" y="30" width="180" height="60" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.4" rx="6"/>
  <text x="1150" y="68" text-anchor="middle" fill="#FFFFFF" font-family="Georgia, Microsoft YaHei, serif" font-size="22" font-weight="bold">
    MATAX
  </text>
  
  <!-- Main title -->
  <text x="640" y="250" text-anchor="middle" fill="#003366" font-family="Georgia, Microsoft YaHei, serif" font-size="56" font-weight="bold">
