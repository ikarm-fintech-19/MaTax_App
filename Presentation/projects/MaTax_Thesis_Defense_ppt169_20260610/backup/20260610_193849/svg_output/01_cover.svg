  </text>
  
  <!-- Bottom info -->
  <rect x="0" y="650" width="1280" height="70" fill="#003366"/>
  <text x="640" y="692" text-anchor="middle" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="16">
