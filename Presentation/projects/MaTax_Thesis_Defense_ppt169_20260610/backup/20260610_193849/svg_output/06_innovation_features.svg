  <text x="245" y="548" text-anchor="middle" fill="#64748B" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13">بصيغة PDF</text>
  <text x="245" y="578" text-anchor="middle" fill="#2E7D32" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="bold">صفر أخطاء يدوية</text>
  
