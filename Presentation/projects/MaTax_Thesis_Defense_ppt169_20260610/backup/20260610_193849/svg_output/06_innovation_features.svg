  <!-- Card 2: استباقية -->
  <rect x="455" y="145" width="370" height="220" fill="#F8FAFC" rx="12" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="455" y="145" width="370" height="8" fill="#0066CC" rx="4"/>
  <circle cx="640" cy="195" r="28" fill="#0066CC" fill-opacity="0.12"/>
  <text x="640" y="203" text-anchor="middle" fill="#0066CC" font-family="Arial, sans-serif" font-size="24" font-weight="bold">🔔</text>
