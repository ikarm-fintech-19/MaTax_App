  <text x="640" y="578" text-anchor="middle" fill="#1565C0" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="bold">اشتراكات من 1,490 دج/شهر</text>
  
  <!-- Card 6: سحابية -->
  <rect x="850" y="395" width="370" height="220" fill="#F8FAFC" rx="12" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="850" y="395" width="370" height="8" fill="#6A1B9A" rx="4"/>
  <circle cx="1035" cy="445" r="28" fill="#6A1B9A" fill-opacity="0.12"/>
  <text x="1035" y="453" text-anchor="middle" fill="#6A1B9A" font-family="Arial, sans-serif" font-size="24" font-weight="bold">☁️</text>
  <text x="1035" y="500" text-anchor="middle" fill="#6A1B9A" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold">بنية تحتية سحابية</text>
  <text x="1035" y="528" text-anchor="middle" fill="#64748B" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13">استضافة Cloudflare المحمية</text>
  <text x="1035" y="548" text-anchor="middle" fill="#64748B" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13">بتشفير 256-SSL</text>
