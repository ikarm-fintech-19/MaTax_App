  <text x="1035" y="328" text-anchor="middle" fill="#0099AA" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12" font-weight="bold">تحديث تلقائي مع القوانين المالية</text>
  
  <!-- Row 2 -->
  <!-- Card 4: أتمتة -->
  <rect x="60" y="395" width="370" height="220" fill="#F8FAFC" rx="12" stroke="#E2E8F0" stroke-width="1"/>
