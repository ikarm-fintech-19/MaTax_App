<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- Background -->
  <rect width="1280" height="720" fill="#FFFFFF"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="1280" height="70" fill="#003366"/>
  <rect x="0" y="0" width="6" height="70" fill="#CC0000"/>
  <text x="40" y="46" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="28" font-weight="bold">
    02 | الجوانب الابتكارية للمشروع
  </text>
  <text x="1220" y="46" text-anchor="end" fill="#FFFFFF" font-family="Georgia, Microsoft YaHei, serif" font-size="18" font-weight="bold">MATAX</text>
  
  <!-- Key message bar -->
  <rect x="0" y="70" width="1280" height="50" fill="#F0F4F8"/>
  <rect x="0" y="70" width="6" height="50" fill="#0066CC"/>
  <text x="40" y="102" fill="#1D1D1F" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18">
    6 مبادرات تجعل MATAX خياراً استراتيجياً للمقاولين والشركات الجزائرية
  </text>
  
  <!-- Innovation Grid: 3 columns x 2 rows with better spacing -->
  <!-- Row 1 -->
  <!-- Card 1: بسيطة -->
  <rect x="60" y="145" width="370" height="220" fill="#F8FAFC" rx="12" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="60" y="145" width="370" height="8" fill="#003366" rx="4"/>
  <circle cx="245" cy="195" r="28" fill="#003366" fill-opacity="0.12"/>
  <text x="245" y="203" text-anchor="middle" fill="#003366" font-family="Arial, sans-serif" font-size="24" font-weight="bold">🚀</text>
  <text x="245" y="250" text-anchor="middle" fill="#003366" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold">بسيطة وسلسة</text>
  <text x="245" y="278" text-anchor="middle" fill="#64748B" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13">واجهة مستخدم سلسة لا تتطلب</text>
  <text x="245" y="298" text-anchor="middle" fill="#64748B" font-family="Microsoft YaHei, Arial, sans-serif" font-size="13">خبرة محاسبية مسبقة</text>
