<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <!-- Background -->
  <rect width="1280" height="720" fill="#FFFFFF"/>
  
  <!-- Header -->
  <rect x="0" y="0" width="1280" height="70" fill="#003366"/>
  <rect x="0" y="0" width="6" height="70" fill="#CC0000"/>
  <text x="40" y="46" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="28" font-weight="bold">
    03 | السوق والنموذج التجاري
  </text>
  <text x="1220" y="46" text-anchor="end" fill="#FFFFFF" font-family="Georgia, Microsoft YaHei, serif" font-size="18" font-weight="bold">MATAX</text>
  
  <!-- Key message bar -->
  <rect x="0" y="70" width="1280" height="50" fill="#F0F4F8"/>
  <rect x="0" y="70" width="6" height="50" fill="#0066CC"/>
  <text x="40" y="102" fill="#1E293B" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18">
    MATAX يستهدف شرائح متنوعة من المقاولين والشركات الجزائرية
  </text>
  
  <!-- LEFT: Market Segments -->
  <rect x="40" y="140" width="600" height="510" fill="#F8FAFC" rx="12" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="40" y="140" width="600" height="55" fill="#003366" rx="12"/>
  <rect x="40" y="185" width="600" height="10" fill="#003366"/>
  <text x="340" y="178" text-anchor="middle" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="bold">الشرائح المستهدفة</text>
  
  <!-- Segment 1 -->
  <rect x="60" y="210" width="560" height="110" fill="#FFFFFF" rx="8" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="60" y="210" width="6" height="110" fill="#DC2626" rx="3"/>
  <text x="110" y="240" fill="#DC2626" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="bold">المقاولون والشركات الناشئة</text>
  <text x="110" y="265" fill="#475569" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14">890,000 مقاول + 46,000 مؤسسة صغيرة ومتوسطة</text>
  <text x="110" y="290" fill="#94A3B8" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12">شريحة النمو الأسرع مع أولوية للرقمنة</text>
  
  <!-- Segment 2 -->
  <rect x="60" y="335" width="560" height="110" fill="#FFFFFF" rx="8" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="60" y="335" width="6" height="110" fill="#0066CC" rx="3"/>
  <text x="110" y="365" fill="#0066CC" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="bold">مكاتب المحاسبة</text>
  <text x="110" y="390" fill="#475569" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14">2,613 مكتب + 12,560 محاسب معتمد</text>
  <text x="110" y="415" fill="#94A3B8" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12">شريحة الاحتراف: بحاجة لأدوات رقمية متقدمة</text>
  
  <!-- Segment 3 -->
  <rect x="60" y="460" width="560" height="110" fill="#FFFFFF" rx="8" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="60" y="460" width="6" height="110" fill="#16A34A" rx="3"/>
  <text x="110" y="490" fill="#16A34A" font-family="Microsoft YaHei, Arial, sans-serif" font-size="17" font-weight="bold">المؤسسات المتوسطة والكبيرة</text>
  <text x="110" y="515" fill="#475569" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14">58,000 مؤسسة + 1,200 مؤسسة خارج النظام الجبائي</text>
  <text x="110" y="540" fill="#94A3B8" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12">حلول مخصصة للمؤسسات متعددة الفروع</text>
  
  <!-- RIGHT: Revenue Streams -->
  <rect x="660" y="140" width="580" height="510" fill="#F8FAFC" rx="12" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="660" y="140" width="580" height="55" fill="#0066CC" rx="12"/>
  <rect x="660" y="185" width="580" height="10" fill="#0066CC"/>
  <text x="950" y="178" text-anchor="middle" fill="#FFFFFF" font-family="Microsoft YaHei, Arial, sans-serif" font-size="22" font-weight="bold">مصادر الإيرادات</text>
  
  <!-- Revenue 1: Subscriptions -->
  <rect x="680" y="210" width="540" height="130" fill="#FFFFFF" rx="8" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="680" y="210" width="6" height="130" fill="#003366" rx="3"/>
  <text x="730" y="240" fill="#003366" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold">الاشتراكات الشهرية/السنوية</text>
  <text x="730" y="268" fill="#475569" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14">Start: 1,490 دج | Pro: 3,490 دج</text>
  <text x="730" y="290" fill="#475569" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14">Enterprise: 5,990 دج</text>
  <text x="730" y="318" fill="#16A34A" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14" font-weight="bold">مصدر الإيراد الأساسي + 70%</text>
  
  <!-- Revenue 2: Extra Services -->
  <rect x="680" y="355" width="540" height="110" fill="#FFFFFF" rx="8" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="680" y="355" width="6" height="110" fill="#0891B2" rx="3"/>
  <text x="730" y="385" fill="#0891B2" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold">الخدمات الإضافية</text>
  <text x="730" y="413" fill="#475569" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14">دعم تقني مخصص + استشارات ضريبية</text>
  <text x="730" y="438" fill="#94A3B8" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12">هوامش ربح عالية + تعميق العلاقة مع العميل</text>
  
  <!-- Revenue 3: Partnerships -->
  <rect x="680" y="480" width="540" height="110" fill="#FFFFFF" rx="8" stroke="#E2E8F0" stroke-width="1"/>
  <rect x="680" y="480" width="6" height="110" fill="#7C3AED" rx="3"/>
  <text x="730" y="510" fill="#7C3AED" font-family="Microsoft YaHei, Arial, sans-serif" font-size="18" font-weight="bold">الشراكات والتعاون</text>
  <text x="730" y="538" fill="#475569" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14">عمولات بيع مشترك مع البنوك</text>
  <text x="730" y="563" fill="#94A3B8" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12">توسيع قاعدة المستخدمين عبر شراكات استراتيجية</text>
  
  <!-- Footer -->
  <line x1="40" y1="670" x2="1240" y2="670" stroke="#E2E8F0" stroke-width="1"/>
  <text x="40" y="700" fill="#94A3B8" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12">المصدر: دراسة المشروع + PRODUCT.md</text>
  <text x="640" y="700" text-anchor="middle" fill="#94A3B8" font-family="Microsoft YaHei, Arial, sans-serif" font-size="12">السوق والنموذج التجاري</text>
  <text x="1220" y="700" text-anchor="end" fill="#64748B" font-family="Microsoft YaHei, Arial, sans-serif" font-size="14">08</text>
</svg>
