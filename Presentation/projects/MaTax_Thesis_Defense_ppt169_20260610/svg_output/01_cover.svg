<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720">
  <rect width="1280" height="720" fill="#FFFFFF"/>
  
  <!-- Top decorative area -->
  <rect x="0" y="0" width="1280" height="120" fill="#00527F"/>
  <rect x="0" y="0" width="8" height="120" fill="#D62828"/>
  
  <!-- Geometric pattern -->
  <path d="M1280 0 L1100 0 L1280 120 Z" fill="#003A51" fill-opacity="0.4"/>
  
  <!-- Logo -->
  <rect x="1060" y="30" width="180" height="60" fill="none" stroke="#FFFFFF" stroke-width="1.5" stroke-opacity="0.5" rx="6"/>
  <text x="1150" y="68" text-anchor="middle" fill="#FFFFFF" font-family="Montserrat, Arial, sans-serif" font-size="22" font-weight="bold">MATAX</text>
  
  <!-- Main title -->
  <text x="640" y="260" text-anchor="middle" fill="#00527F" font-family="Montserrat, Arial, sans-serif" font-size="58" font-weight="bold">منصة MATAX</text>
  <text x="640" y="330" text-anchor="middle" fill="#00527F" font-family="Montserrat, Arial, sans-serif" font-size="38" font-weight="600">التسيير الجبائي الرقمي الذكي</text>
  
  <!-- Subtitle -->
  <text x="640" y="390" text-anchor="middle" fill="#44546A" font-family="Lato Light, Arial, sans-serif" font-size="20">منصة رقمية مبتكرة في مجال التكنولوجيا الجبائية (TaxTech)</text>
  
  <!-- Decorative divider -->
  <line x1="380" y1="430" x2="900" y2="430" stroke="#F77F00" stroke-width="3"/>
  <circle cx="640" cy="430" r="6" fill="#F77F00"/>
  <circle cx="380" cy="430" r="4" fill="#D62828"/>
  <circle cx="900" cy="430" r="4" fill="#D62828"/>
  
  <!-- Presenter info card -->
  <rect x="240" y="465" width="800" height="150" fill="#F8FAFC" rx="12" stroke="#E2E8F0" stroke-width="1"/>
  <text x="640" y="510" text-anchor="middle" fill="#1E293B" font-family="Montserrat, Arial, sans-serif" font-size="24" font-weight="bold">إعداد: حموم إكرام</text>
  <text x="640" y="545" text-anchor="middle" fill="#44546A" font-family="Lato Light, Arial, sans-serif" font-size="18">إشراف: أ. بلعباس مختار - أ. مفتاح فاطمة</text>
  <text x="640" y="580" text-anchor="middle" fill="#44546A" font-family="Lato Light, Arial, sans-serif" font-size="16">جامعة ابن خلدون تيارت | ماستر محاسبة وجباية | 2025/2026</text>
  
  <!-- Bottom bar -->
  <rect x="0" y="650" width="1280" height="70" fill="#00527F"/>
  <text x="640" y="692" text-anchor="middle" fill="#FFFFFF" font-family="Lato Light, Arial, sans-serif" font-size="16">عرض التخرج - startup thesis defense</text>
</svg>
